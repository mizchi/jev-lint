# The config for working on the MoonBit rules in this repository, named
# explicitly: `jev-lint eval rules/moonbit --config docs/moonbit.jev-lint.yaml`.
# It is not the repository's own config -- two in one directory is an error,
# and jev-lint's own source has no MoonBit in it.
#
# The parser is not in the repository: it is a 1.2 MB platform-specific
# library. Build it once with
#
#   npm run parsers:moonbit
#
# which clones moonbitlang/tree-sitter-moonbit and writes
# .jev-lint/parsers/moonbit.dylib (gitignored).
languages:
  moonbit:
    libraryPath: ../.jev-lint/parsers/moonbit.dylib
    extensions: [mbt]
    expandoChar: _
rules:
  moonbit/catch-hides-failure: on
  moonbit/comment-describes-block: on
  moonbit/comment-describes-declaration: on
  moonbit/doc-errors-match-body: on
  moonbit/error-message-matches-condition: on
  moonbit/fn-name-promises: on
  moonbit/idempotent-name: on
  moonbit/log-level-matches-event: on
  moonbit/log-message-matches-event: on
  moonbit/module-name-describes-contents: on
  moonbit/module-naming-consistent: on
  moonbit/pure-name-is-pure: on
  moonbit/safe-name-is-safe: on
  moonbit/snapshot-only-behaviour-claim: on
  moonbit/test-name-describes-code: on
  moonbit/test-name-verifies-claim: on
  moonbit/tests-cover-failure-paths: on
  moonbit/trait-name-describes-methods: on
  moonbit/type-name-describes-shape: on
  moonbit/var-name-describes-value: on
