id: goodhart
language: Git
subject: commit
state: bare
kind: noul
severity: info
threshold: 0.7  # Retained in three-pass separation gap: defects 0.96–0.97, clean max 0.05, max spread 0.02.
ask: Does this change improve a named proxy score by degrading the user outcome
  it is supposed to represent while keeping the measure itself fixed?
criteria:
  "true": Identify the target, the behavior changed to score better, and the
    observable loss for a real caller, such as returning incomplete results to
    meet a latency target.
  "false": An optimization preserving results, a change only to the measurement
    definition, or lack of evidence of a target and tradeoff is insufficient.
category: advisory
nextCheck: Replay the same representative requests before and after the change.
  Compare the reported target with the complete result or delivery guarantee a
  caller receives on those requests.
