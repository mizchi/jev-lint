id: var-name-describes-value
language: Python
kind: noul
subject: node
state: located
# 0.44, refit 2026-09-22 (30 subjects: 7 defects, 23 cleans, 2 runs of 3
# passes each, 6 samples per new case; up from 6/20) after porting
# typescript/var-name-describes-value's jobs.ts shape (the query-unwrap
# mismatch) into a new fixtures/jobs.py. Both sides are `state: located`, so
# the port carries the file's context rather than stripping it.
# `send_digest_emails`'s `users` (from sendDigestEmails, 0.59 there against a
# 0.5 cutoff) is bound to the raw query result, not to `.rows`; the loop two
# lines down reads `users.rows`, so the name claims the unwrapped rows while
# the binding still holds the wrapper. It answers 0.47-0.55 across both runs,
# the new quietest defect -- at the old cutoff (0.57) this would have been a
# miss, the same shape as typescript/var-name-describes-value's own
# batch.test.ts:33. Rather than keep it as a documented miss, the cutoff is
# refit down through it: nothing between it and the loudest clean is closer,
# so this is the corpus's actual gap, not one case gerrymandered around. The
# loudest clean is still `healthy` (a test binding holding the count it is
# named for, already documented with up to 0.11 of spread): 0.30-0.41 across
# both runs. `rebalance_shards`'s `shards` (from rebalanceShards, 0.36 there)
# is a count read from a setting and compared with 1, the plural-for-a-count
# convention where the initializer is a call; answers 0.26-0.34 across both
# runs, comfortably clean and not the binding constraint. The other two
# ported cases are hard cleans, unchanged from typescript's reasoning:
# `result` (0.04-0.10, generic and accurate) and `documents` (0.07-0.08,
# named for the `.rows` it is bound to). Original defects still start at
# 0.80 (`domain_of`'s off-by-one on which side of `@` `username` names). Set
# at the midpoint of the worst-case gap seen across both runs (0.47 low,
# 0.41 high), not of a single run's mean, so one noisy pass does not flip a
# decision. FN-margin 0.03 (`users` at its lowest sampled value), FP-margin
# 0.03 (`healthy` at its highest) -- was 0.26/0.35 (blind) before the port.
# This is a deliberately tight fit, tighter than the general 0.25-of-scale
# floor: `users` and `healthy` are noisy enough pass to pass that a future
# run could cross 0.44 from either side, which is what a corpus that can see
# the boundary is supposed to risk. No decision flips against the pre-port
# population; the one addition that would have been a miss at the old
# cutoff is instead correctly caught by the refit one.
#
# 2026-09-22: the crossing this comment warned about showed up under
# `eval --replay`'s interval-aware fit, which checks each margin against
# its OWN case's pass-to-pass spread rather than the mean alone. On the
# current baseline `users` (jobs.py:32) answers mean 0.5067 (passes
# 0.57/0.48/0.47, spread 0.10) and `healthy` (test_client.py:60) answers
# mean 0.3367 (passes 0.33/0.29/0.39, spread 0.10). Clearing `users`' own
# spread needs `at` <= 0.41; clearing `healthy`'s needs `at` >= 0.43 -- the
# two requirements do not overlap, so no cutoff resolves both, checked by
# hand against every two-decimal value from 0.40 to 0.44. `at: 0.44` is
# kept: it is the shipped value this paragraph already chose deliberately,
# it still clears `healthy` (FP-margin 0.10, equal to spread), and only
# `users` remains inside its own noise band (FN-margin 0.07, spread 0.10).
inconclusive: >-
  `users` (jobs.py:32, mean 0.5067, spread 0.10) and `healthy`
  (test_client.py:60, mean 0.3367, spread 0.10) sit close enough, and wobble
  enough pass to pass, that no cutoff clears both cases' own spread: fixing
  `users`' FN-margin needs at <= 0.41, fixing `healthy`'s FP-margin needs at
  >= 0.43. This is the crossing the `at:` comment above already predicted
  when the corpus was ported, not a new defect in the rule.
at: 0.44
axis: file
severity: warning
rule:
  all:
    - kind: assignment
    - has: { field: left, kind: identifier, pattern: $NAME }
    - has: { field: right, pattern: $VALUE }
    # Functions are judged by `fn-name-promises`; this rule is about values.
    - not:
        has: { field: right, kind: lambda }
ask: >-
  This binding's name misdescribes the value it is bound to.
criteria:
  "true": >-
    The name states a type, unit, shape, quantity or meaning that the
    initializer does not produce: a plural name bound to a single item or a
    singular name bound to a collection, a name that reads as a boolean bound to
    something that is not one, a name naming one unit while the value is in
    another, a name saying it holds a value while it holds a function or a
    promise, or a name describing a different thing entirely from what the
    initializer computes.
  "false": >-
    The name is an accurate description of what the initializer produces, even
    if it is terse or a clearer name could be imagined. Being short or generic
    is not a mismatch.
note: >-
  Compare the name with the initializer and with every use of the binding in
  this file; a mismatch is one the code shows. It counts when the binding is
  used as a different kind of thing from what the name says (a boolean name on a
  value compared with a string, a number or a variant; a path name on contents
  that are split into lines; a result name on a promise that is pushed or
  awaited; a unit suffix on a value the code converts from or compares with
  another unit); when the initializer selects a different element, part or field
  from the one the name names (the first element under a name meaning the last,
  the piece before a separator under a name meaning the piece after it, one
  field of a record under the name of another of its fields); or when the name
  asserts success or presence and the code then reads the value as a failure or
  an absence. It does not count when the name is a convention rather than a
  claim: a plural name on a number, which names the count of those things
  whether the number is a literal or comes from a call; a short accumulator,
  index or buffer name; a collection named for its role such as a set of seen
  items or a list of pending work; a list of test inputs named for the class
  they belong to and paired with the opposite class; a test binding named for
  the scenario it exercises, such as the response to the unauthorized request or
  to the request missing a field, which reads as an adjective and holds the
  result of that scenario; or a name that gives the value's role or provenance
  rather than its type.
