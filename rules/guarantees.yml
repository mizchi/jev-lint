# Guarantee names: a name that promises something specific, and a body that
# does not keep the promise.
#
# The shipped fn-name-promises asks whether a body does what its name says in
# general, and on the corpus behind these rules it flags 0 of the 22 labelled
# defects at its cutoff -- 16 of them sit under 0.30, inside its clean band. A
# name that says *safe* or *ensure* makes a narrower claim than "describes the
# body", and the narrower question separates where the general one does not.
# The naming is the matcher's job (a regex on the captured $NAME); only the
# promise is the model's.
#
# Cutoffs fitted on corpus/ts/guarantees/ (hand-labelled: see
# corpus/labels.hand.json), then run once over an unseen repository of 1,391
# subjects, where neither rule fired and the highest answer was 0.26.
#
# Not shipped from the same family, both in
# experiments/rule-candidates/b-guarantee-names/REPORT.md: guard-name-guards
# (validate*/sanitize*/ensure*; separates, but on four defects) and
# pure-name-is-pure (compute*/format*/parse*; separates on the corpus, and on
# unseen code half its findings were one pattern, a lazily loaded module
# counted as I/O).

- id: safe-name-is-safe
  languages:
    - TypeScript
    - Tsx
    - JavaScript
    - Jsx
  kind: noul
  subject: node
  state: local
  at: 0.53
  rule:
    any:
      - all:
          - kind: function_declaration
          - has: &a1
              field: name
              pattern: $NAME
              regex: ^(safe|try)([A-Z0-9_]|$)|(OrNull|OrDefault|OrUndefined)$
      - all:
          - kind: method_definition
          - has: *a1
      - all:
          - kind: variable_declarator
          - has: *a1
          - has:
              field: value
              any:
                - kind: arrow_function
                - kind: function_expression
  ask: This function's name ($NAME) says that failure is absorbed and reported as a value, but its
    body has a path on which a failure escapes as a throw or a rejection.
  criteria:
    "true": "A failure of the kind the name promises to absorb can reach the caller as an exception or a
      rejected promise: the operation that can fail is outside any try, the catch rethrows or throws
      a new error, a failing case is detected and answered with a throw instead of the null,
      undefined, default, false or result value the name promises, or the fallback itself is
      computed by something that can fail."
    "false": "Every failure of the kind the name refers to is turned into the value the name promises:
      null, undefined, a default, a boolean, or a result object the caller can inspect. A body that
      cannot fail at all, and so has nothing to catch, honours the name."
  note: "A throw on a programmer error -- an argument of the wrong type, a misuse of the function's
    own API -- is not the failure such a name promises to absorb and does not count. Logging before
    returning the fallback is fine. The failure that counts is the one the name and the parameters
    are about: parsing, lookup, I/O, connection, conversion."
  axis: file
- id: idempotent-name
  languages:
    - TypeScript
    - Tsx
    - JavaScript
    - Jsx
  kind: noul
  subject: node
  state: located
  # 0.40, not the fitted midpoint of 0.34: one defect (an unconditional ALTER
  # TABLE in a setup function) answers 0.36-0.51 across passes, and a cutoff
  # under its band catches it on every pass while the highest clean sits at
  # 0.32. Measured on `local` the same defect answers 0.22-0.28 -- under the
  # cleans -- which is why this rule alone in its pack carries the file.
  at: 0.4
  rule:
    any:
      - all:
          - kind: function_declaration
          - has: &a2
              field: name
              pattern: $NAME
              regex: ^(ensure|upsert|setup|install|register)([A-Z0-9_]|$)
      - all:
          - kind: method_definition
          - has: *a2
      - all:
          - kind: variable_declarator
          - has: *a2
          - has:
              field: value
              any:
                - kind: arrow_function
                - kind: function_expression
  ask: This function's name ($NAME) says a repeated call is harmless, but calling it a second time
    with the same arguments leaves a different result from calling it once.
  criteria:
    "true": "The body performs its effect without finding out whether it is already in place, and
      repeating the effect accumulates or fails: it appends to a list or adds a listener, creates a
      record, index, table, column or resource that would then exist twice or make the second
      creation fail, inserts where a matching row may already be, or runs a step that is not itself
      safe to repeat -- with no existence check, no keyed overwrite and no guard that makes the
      second call a no-op. One such step is enough, even when the other steps of the body are safe
      to repeat."
    "false": "A second call finds the effect already in place and leaves the state as the first call
      left it: the body checks for existence before acting, writes by key so a repeat overwrites the
      same entry, assigns rather than appends, uses an operation that is inherently repeatable (put,
      set, mkdir with recursive, CREATE IF NOT EXISTS, ON CONFLICT), returns early on a flag it
      sets, or has no effect at all beyond its return value."
  note: Only this body is judged. A helper it calls whose own name says it is repeat-safe (ensure*,
    upsert*, put*, set*, *IfNotExists) is assumed to be. Logging on each call, or returning a fresh
    object each call, is not a different result. A function whose name says ensure but is a pure
    conversion of its argument has nothing to repeat and is not a violation.
  axis: file

# pure-name-is-pure: compute*/calculate*/derive*/format*/to*/parse* with a body
# that reaches outside itself. Revision 2 of the family's rule: revision 1
# counted a lazily loaded module as I/O and was wrong on all six of its
# findings on an unseen repository. The criteria now separate acquiring a
# dependency (a memoised loader, a require-once cache, a registry lookup:
# not an effect) from caching this function's own result (an effect), and
# say that one read on any path is enough -- a default taken from the clock,
# the environment or a random source is the read. Precision 1, recall 1 on
# 28 subjects (12 defective); on the unseen repository, six findings, all
# real: parse* functions defaulting a field to new Date(), process.env or
# randomUUID(). The cutoff is 0.55, above the 0.46 midpoint, because the
# unseen clean band tops at 0.50 -- 0.05 of headroom, which is why this
# ships at `severity: info`. Full account in
# experiments/rule-candidates/b-guarantee-names/REPORT.md.
- id: pure-name-is-pure
  languages:
    - TypeScript
    - Tsx
    - JavaScript
    - Jsx
  kind: noul
  subject: node
  state: local
  at: 0.55
  rule:
    any:
      - all:
          - kind: function_declaration
          - has: &a1
              field: name
              pattern: $NAME
              regex: ^(compute|calculate|derive|format|to|parse)([A-Z0-9_]|$)
      - all:
          - kind: method_definition
          - has: *a1
      - all:
          - kind: variable_declarator
          - has: *a1
          - has:
              field: value
              any:
                - kind: arrow_function
                - kind: function_expression
  ask: This function's name ($NAME) presents it as a computation of a result from its inputs, but its
    body changes state outside itself or performs I/O.
  criteria:
    "true": "The body mutates an argument or something reachable through one, assigns to a module-level
      binding, a field of `this` or an object it did not create, stores something it computed into a
      cache, Map, Set or other store that outlives the call, logs, emits or increments a metric, or
      reads or writes a file, network, database, environment, clock or random source -- directly, or
      through a call whose name or arguments show it does so (fetch, a path, a URL, a query, send,
      save). One such read or write on any path is enough: a default taken from the clock, the
      environment or a random source when a field is missing, or an effect in a fallback branch,
      makes the body impure even though its common path is not."
    "false": The body derives its result from its parameters, from `this`, from module-level values it
      only reads, and from dependencies it obtains -- a module, binding, table, formatter, parser or
      backend handed back by a loader, resolver or registry lookup -- and returns it. A mutable
      local accumulator, a copy of an argument that is then modified, and a local object built up
      and returned are not effects outside the function.
  note: "Obtaining a dependency is not an effect. Calling or awaiting a helper that hands back a
    module, native binding, compiled table, backend or client (get*Module, load*, require, resolve*,
    a dynamic import) acquires something the body needs; that the helper memoises what it loaded is
    the helper's business, not this body's. What is judged is what the body then does with its
    inputs: calling a pure function of an acquired module is a computation, using an acquired client
    to fetch, read, write or send is I/O. The line is what gets written: a body that puts its own
    result -- a value it computed, a key it generated, a formatter it built -- into a cache, Map or
    Set that outlives the call changes what later calls observe and is an effect even when it is
    only memoisation; a body that only takes a dependency out of such a store is not. A helper that
    receives its input from a parameter (readEnvInt(raw.count, ...)) reads that argument, not the
    environment, whatever its name says. Reading `this` in a toJSON, toString or similar method is
    reading, not writing. Sorting or mutating a copy the body made itself is not mutating the
    argument."
  axis: file
  severity: info
