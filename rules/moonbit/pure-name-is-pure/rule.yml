# pure-name-is-pure, ported to MoonBit from rules/python/pure-name-is-pure
# (snake_case, so the name regex carries over) and
# rules/typescript/pure-name-is-pure (the fuller criteria). The criteria are
# rewritten rather than copied: MoonBit's effects are a closed, visible set --
# assignment to a `mut` field, a mutating method on an Array/Map/Ref, a
# top-level binding, `println` -- and none of them is caught by the type
# system, which is what leaves work for a rule in a language this strict.
id: pure-name-is-pure
language: moonbit
kind: noul
subject: node
# `located`, where python and typescript both use `local`. A MoonBit module is
# a flat sheet of free functions, and the fact that decides most subjects --
# whether `score_cache` is a top-level store or a local accumulator -- is on a
# line the subject's own text does not contain.
state: located
# 0.55, refit 2026-09-22 (32 subjects: 12 defects, 20 cleans, 3 passes; up
# from 30/11/19). The clean band is 0.02-0.07 apart from one member,
# unmoved by the port: `format_weight_band`, which asks a helper for a
# table the helper fills in on its first call, answers 0.24. Defects start
# at 0.87-0.90 (`parse_next_field`, a cursor that removes from the Array it
# was handed) and everything else answers 0.90-0.98. Midpoint of the gap is
# 0.55.
#
# Two cases were ported in from typescript's tighter corpus, the pair that
# sits nearest its own cutoff there (parseCliOptions at 0.55-0.56,
# parseWorkerLimits at 0.23-0.28): `parse_billing_options`, which reads
# `@sys.getenv(..)` as an unconditional default before an argv loop that can
# override it, and `parse_import_limits`, whose helpers are named
# `read_env_*` but only ever touch the parameter they were handed. Neither
# ported near this rule's own boundary: `parse_billing_options` answers
# 0.89 (as confident as the rest of the loud defects) and
# `parse_import_limits` answers 0.04 (as confident as the rest of the
# trivially pure band). The margins are unchanged within run noise (FN
# 0.32, FP 0.31, against 0.34/0.34 before the port).
#
# Read together with typescript's `state: local`, this is a finding about
# `state: located` rather than a fixture to keep chasing: this rule shows
# the model the WHOLE file per subject (the file-axis note above explains
# why MoonBit needs that), so the two things that kept typescript's judge
# hedging -- not being sure whether `readEnvInt`/`readEnvString` truly
# never touch the environment, and not being sure the env read survives to
# the return -- are resolved on sight here: the helper bodies and the
# override branch are both already in view. The ambiguity typescript's
# cutoff sits on is partly a property of what `local` withholds, not of
# the situation alone, and porting the case without the narrower state
# that produced its uncertainty does not reproduce the uncertainty. Both
# fixtures are kept: they are correctly labelled, correctly decided, and
# the first cases in this corpus to exercise an environment read at all.
#
# Boundary hunt, 2026-09-22 (39 subjects: 15 defects, 24 cleans, up from
# 12/20; 3 passes; margins did not move). Two full rounds targeted the
# cutoff directly and both confirm rather than narrow it. Round 1's four
# candidates were all the "is a container this body built itself still
# exempt when it isn't an Array/Map/StringBuilder" question: a `mut` field
# of a locally-built struct filled directly (`calculate_shipping_weight`,
# 0.06) or through a one-hop helper (`calculate_average_price`, 0.07), and
# a `Ref::new` accumulator born and discarded inside the call
# (`calculate_running_max_price`, 0.11) all answer as confidently clean as
# the rest of the trivial band -- drafted as boundary-bad tests of the
# true-criteria's literal wording, relabelled clean on rereading the
# false-criteria's own principle ("where it came from, not how much it is
# written to"), which the model evidently applies to a struct exactly as it
# does to the named containers. `to_price_tag` (0.93), reusing `bands()`'s
# fill-on-first-call vocabulary over a Map field the body received as a
# parameter rather than owns, does not borrow the exemption -- answers as
# loud as the rest of the parameter-write band. One candidate did cross
# the line the other way and was relabelled to match: `to_summary_label`
# (0.87) calls a method that mutates the very Catalog this body was handed,
# dressed in `bands()`'s "hands back a value, fills itself in" phrasing;
# drafted as boundary-clean, it is a parameter write one hop out and belongs
# with `compute_totals`, not `format_weight_band`. Round 2 pushed the same
# two questions further and both moves failed to move the score: a second
# hop on the delegation chain (`to_revision_label`, three functions,
# `catalog.revision` reassigned by the innermost) answers 0.94, louder than
# the one-hop version, not quieter; a Map parameter read via `.get()` beside
# a same-shaped local Map written via `.set()` two lines apart
# (`derive_price_index`) answers 0.07, as confidently clean as an accumulator
# with nothing beside it to confuse.
#
# FN-margin 0.32 (`to_summary_label` at 0.87), FP-margin 0.30
# (`format_weight_band` at 0.25) -- unchanged from 0.32/0.31 within run
# noise, despite nine boundary-aimed candidates across two rounds finding
# real, correctly-labelled cases on both sides. The pattern across all of
# them: MoonBit's effect vocabulary is closed and the whole file is in
# view under `located`, so once a candidate resolves which store a write
# lands on -- the caller's, a scratch object that dies with the call, or a
# shared file-level cache -- the answer is confident either way; nothing
# tried left the model genuinely unsure. This rule's boundary did not move
# under a real search for it; the corpus is wider and better-argued at both
# ends, not narrower in the middle.
threshold: 0.55
# Declared after the search above, not in place of it. Nine boundary-aimed
# candidates over two rounds moved the margins from 0.34/0.34 to 0.32/0.30 --
# that is run noise, not a narrower corpus.
inconclusive: >-
  The middle of this scale is empty because the language and the state arm
  leave the model nothing to be unsure about, not because nobody looked.
  MoonBit's effect vocabulary is closed and `state: located` puts the whole
  file in view, so once a candidate resolves which store a write lands on --
  the caller's, a scratch object that dies with the call, or a file-level
  cache -- the answer is confident either way. Nine candidates aimed at the
  cutoff across two rounds (2026-09-22) each landed in one confident band or
  the other; two were relabelled on what they turned out to show. The
  per-candidate scores are in the `threshold:` comment above. The pair that sits on
  typescript's own cutoff was ported in and did not carry its uncertainty:
  under `local` the judge cannot see whether the helpers touch the
  environment, and that doubt is what put those cases mid-scale there.
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: info
rule:
  all:
    - kind: function_definition
    # MoonBit's grammar declares no fields, so the name is matched by kind.
    # `function_identifier` holds the whole `Type::method` for a method
    # definition, so the qualifier has to be optional in the regex: without it
    # every `Catalog::compute_*` and `Product::to_*` is invisible, and those
    # are where MoonBit puts the mutation of a receiver.
    - has:
        kind: function_identifier
        stopBy: end
        pattern: $NAME
        regex: ^([A-Za-z][A-Za-z0-9_]*::)?(compute|calculate|derive|format|to|parse)(_|$)
divergent: >-
  Two MoonBit facts the shared sentence cannot carry. Its top-level `let`
  binds the name and not the contents, so `let queue : Array[String] = []`
  beside the functions is a store anything in the file can push to, and
  pushing to it is an effect although nothing was reassigned. And MoonBit
  code builds results imperatively as a matter of course, so the mirror case
  -- a fresh `Array`, `Map` or `StringBuilder` created in the body, filled in
  a loop and returned -- has to be spelled out or every such body reads as a
  write. The shared copy's `this`, promises and dynamic imports name nothing
  in a `.mbt` file.
ask: >-
  This function's name ($NAME) presents it as a computation of a result from its
  inputs, but its body changes state outside itself or performs I/O.
criteria:
  # Both branches describe what is in the function's own text. An exception
  # phrased in terms of something the subject cannot show -- "unless the caller
  # relies on it" -- makes every answer land mid-scale, which looks like a
  # threshold problem and is not one.
  "true": >-
    The body writes to something that already existed when the call began or
    that outlives the call, or it performs I/O. In MoonBit that means: it
    assigns to a `mut` field of a struct it was handed, of `self`, or of
    anything reached through a parameter; it calls `push`, `set`, `clear`,
    `remove`, `swap` or another mutating method on an `Array`, `Map`, `Set`,
    `Ref` or `StringBuilder` that arrived as a parameter or is a top-level
    binding; it assigns through a top-level `let mut` or a `Ref`; it stores
    what this call computed into a cache or memo table a later call will read;
    it calls `println` or otherwise writes to stdout, a file, a socket, a
    database or a log; or it reads the clock, the environment or a random
    source. One such write or read on any path is enough: an effect that
    happens only in a fallback or error branch still makes the body impure.
    An effect one hop away is still this body's: calling a function defined in
    this file that prints, or that writes this body's result into a store, is
    doing it.
  "false": >-
    The body derives its result from its parameters and from top-level values
    it only reads, and returns it. Building the result imperatively is not an
    effect: an `Array`, `Map`, `StringBuilder` or `mut` local that this body
    creates itself, fills in a loop and returns is how the result is computed,
    however heavily it is written to. Reading a struct that has `mut` fields,
    or an `Array` or `Map` that was handed in, without assigning or pushing to
    it, is reading. Obtaining something the body needs is not an effect
    either: a helper that hands back a table, a parser, a formatter or a
    client, and fills it in on the first call, is doing its own bookkeeping,
    not this body's -- what counts is what this body then does with what it
    was handed, and reading it is reading. Converting a value to a `String`, a
    `Json` or another representation, concatenating or interpolating text, and
    returning `None` or an error value instead of a result, are all
    computations.
note: >-
  MoonBit's top-level `let` binds the name, not the contents: `let queue :
  Array[String] = []` beside the functions is a store that anything in the file
  can push to, and pushing to it is an effect even though nothing was
  reassigned. Its mirror is the case to get right, because MoonBit code builds
  results imperatively as a matter of course: a fresh `Array`, `Map` or
  `StringBuilder` created inside the body and returned is the result, and
  filling it is the computation. What separates the two is where the container
  came from, not how much it is written to. A `mut` field is a defect only when
  the body assigns to it; a parameter's mutability is an invitation the body is
  free to decline. The line through a helper is what gets written: a helper
  that hands this body a value is a dependency, a helper that puts this body's
  own result somewhere, or prints it, is this body's effect. Do not judge
  whether the function can fail -- `raise` is part
  of a MoonBit function's type and the compiler already checks it -- and do not
  count `abort`, `panic` or `unwrap` here: they end the program rather than
  change what a later call observes.
