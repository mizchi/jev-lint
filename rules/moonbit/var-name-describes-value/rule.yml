id: var-name-describes-value
language: moonbit
kind: noul
subject: node
# `located`, as in every other language: this rule is not separable on
# `bare` -- the uses of the binding are what show the mismatch, and they
# are in the file.
state: located
# 0.62, refit 2026-09-22 chasing the boundary on the fixtures beside it (27
# subjects: 9 defects, 18 cleans, 3 passes) after six boundary candidates were
# added, three aimed at each side. Two of three quiet-defect attempts stayed
# quiet exactly as calibration.md's caveat predicts: `distinct_tags`, which
# only rejects a duplicate immediately following itself (0.09-0.13), and
# `deduped_names`, whose `seen` array is read via `.contains` but never
# written to (0.08-0.09) -- both are a shape claim about what comes back
# rather than a numeric claim, and the model reads the shape of the check,
# not whether it does anything. The third, `sorted_by_time` (a single
# adjacent-swap pass under a name that claims full order; `[2,4,1,3]` by
# `ms` comes back `[2,1,3,4]`, still unsorted), landed at 0.37-0.44 -- closer,
# but still a miss at any cutoff this fit can defend, because `fully_sorted`,
# its correct twin (the same shape, `n` passes instead of one), answered
# 0.49-0.55: a real defect and a real clean sit inverted, 0.40 under 0.52,
# and no single cutoff gets both right. Catching `sorted_by_time` costs a
# false flag on `fully_sorted`, and a linter that flags correct code on
# sight is the worse trade, so the cutoff sits above 0.52, not at the
# tool-fitted 0.40 that buys the catch at that price. Above 0.52 the next
# gap is real: `unique_ids` (`deduped_names`'s correct twin, checking its
# own growing result) tops the rest of the clean band at 0.20, and the
# cheapest defect this fit still catches, `slowest`, starts at 0.72-0.74.
# 0.62 is the midpoint of 0.52-0.73, not the whole corpus's midpoint: 0.11
# of headroom against `fully_sorted`, 0.10 against `slowest`. Rust sits at
# 0.5 and this no longer matches it -- the MoonBit corpus now carries an
# overlap the other two languages' corpora have not been made to show.
#
# Residue, left as labelled misses rather than relabelled: `distinct_tags`
# (0.09-0.13), `deduped_names` (0.08-0.09) and `sorted_by_time` (0.37-0.44)
# all score under 0.62 and are bad. The rule does not find any of the
# three, and the corpus keeps them as defects this rule misses rather than
# quietly dropping them.
#
# Prior fit (2026-09-21, superseded): 0.5 on 18 subjects, cleans topping at
# 0.24 against defects starting at 0.82. One label moved during that fit:
# `names` bound to `rows.length()` was labelled a defect and answered
# 0.22-0.25; the rust copy's own corpus has that shape (`lines` bound to a
# count) as its HIGHEST clean, so the family already reads a plural name
# over a count of those things as acceptable, and the label was out of step
# with the family, not the model with the label.
threshold: 0.62
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: warning
# Three shapes bind a name in MoonBit: `let`, `let mut` inside a body, and
# a top-level `value_definition`. The grammar declares no fields, so the
# name is the identifier under the binding; `stopBy: end` would reach into
# the VALUE and capture an identifier from there, so each alternative names
# the immediate child instead.
rule:
  any:
    - all:
        - kind: let_expression
        - has: { kind: lowercase_identifier, pattern: $NAME }
    - all:
        - kind: let_mut_expression
        - has: { kind: lowercase_identifier, pattern: $NAME }
    - all:
        - kind: value_definition
        - has: { kind: lowercase_identifier, pattern: $NAME }
# The same sentence as typescript/var-name-describes-value, by copy.
ask: >-
  This binding's name misdescribes the value it is bound to.
criteria:
  "true": >-
    The name states a type, unit, shape, quantity or meaning that the
    initializer does not produce: a plural name bound to a single item or a
    singular name bound to a collection, a name that reads as a boolean bound to
    something that is not one, a name naming one unit while the value is in
    another, a name saying it holds a value while it holds a function or a
    promise, or a name describing a different thing entirely from what the
    initializer computes.
  "false": >-
    The name is an accurate description of what the initializer produces, even
    if it is terse or a clearer name could be imagined. Being short or generic
    is not a mismatch.
note: >-
  Compare the name with the initializer and with every use of the binding in
  this file; a mismatch is one the code shows. It counts when the binding is
  used as a different kind of thing from what the name says (a boolean name on a
  value compared with a string, a number or a variant; a path name on contents
  that are split into lines; a result name on a promise that is pushed or
  awaited; a unit suffix on a value the code converts from or compares with
  another unit); when the initializer selects a different element, part or field
  from the one the name names (the first element under a name meaning the last,
  the piece before a separator under a name meaning the piece after it, one
  field of a record under the name of another of its fields); or when the name
  asserts success or presence and the code then reads the value as a failure or
  an absence. It does not count when the name is a convention rather than a
  claim: a plural name on a number, which names the count of those things
  whether the number is a literal or comes from a call; a short accumulator,
  index or buffer name; a collection named for its role such as a set of seen
  items or a list of pending work; a list of test inputs named for the class
  they belong to and paired with the opposite class; a test binding named for
  the scenario it exercises, such as the response to the unauthorized request or
  to the request missing a field, which reads as an adjective and holds the
  result of that scenario; or a name that gives the value's role or provenance
  rather than its type.
