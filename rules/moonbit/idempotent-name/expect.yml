fixtures/registry.mbt:
  - line: 64
    label: bad
    window: 0
    reason: "`register_hook` pushes onto a module-level `Array[Hook]` with no membership check, so registering the same event twice leaves the handler installed twice."
  - line: 69
    label: clean
    window: 0
    reason: "hard clean: `register_plugin` has no check either, but it writes `plugins.set(name, ...)` on a `Map` keyed by the name -- the second call overwrites the same key, which is exactly idempotent. The twin of `register_hook`, and the pair the rule exists to tell apart."
  - line: 74
    label: clean
    window: 0
    reason: "boundary clean: `register_boot` increments `metrics.boots` -- the same effect `setup_metrics` below performs unconditionally -- but does it behind `not(plugins.contains(name))`, keyed on the same field the keyed write below it also uses; a second call with the same name finds the membership check already true and skips the increment. The correct twin of `ensure_metric_slot` and `register_login`, both added the same day: the guard exists AND checks the collection the effect actually depends on. Answered 0.54, 0.71, 0.56 across the accepted three passes -- decided correctly on the mean (0.60) but not settled, since the 0.71 pass alone crosses the fitted 0.67; see the `at:` comment."
  - line: 82
    label: bad
    window: 0
    reason: "`register_tag` ends in `tags.set(tag, current)`, which reads as the idempotent keyed write, but the value it sets is the previous array with `name` pushed onto it: the key is overwritten and the list under it grows by one every call. The inverse of `register_plugin`."
  - line: 92
    label: bad
    window: 0
    reason: "boundary defect: `ensure_metric_slot` has a guard -- `if load_order.contains(name) { return }` -- so it reads as the canonical shape `ensure_plugin_slot` uses below. But the effect is `hooks.push(...)`, and nothing in this function or reachable from it ever adds `name` to `load_order`: the checked collection and the affected collection are different arrays, so the guard never gates this function's own push and every call accumulates. The guard is present; the boundary it checks is shifted onto the wrong collection."
  - line: 100
    label: bad
    window: 0
    reason: "`register_run` also ends in a `Map::set`, but keys it by `runs.length()`, which the previous call changed: the same argument twice lands under two different keys. A keyed write is only idempotent when the key is a function of the arguments."
  - line: 106
    label: clean
    window: 0
    reason: "hard clean: `upsert_hook` pushes onto the same array `register_hook` does, but only after scanning for an existing entry for the event and replacing it in place -- an array-backed upsert done correctly."
  - line: 117
    label: clean
    window: 0
    reason: "hard clean: `install_index` guards a keyed write on the same map it writes -- `if tags.contains(name) { return }` then `tags.set(name, [])` -- the canonical correct shape on `tags`, the map `register_tag` above corrupts by a different mistake."
  - line: 125
    label: bad
    window: 0
    reason: "`install_plugin` does check existence, and then `abort`s on it: the first call installs and the second kills the process. The failure mode rather than the duplication one; a body that checks is not automatically a repeat-safe body."
  - line: 133
    label: clean
    window: 0
    reason: "hard clean: `install_theme` also `abort`s, but on an invalid argument rather than on the thing already being there; called twice with the same valid arguments it takes the same keyed write both times."
  - line: 141
    label: clean
    window: 0
    reason: "boundary clean: `upsert_theme` is the same body as `install_theme` above with the abort replaced by a plain early return on the same invalid-input condition; the guard still checks an input property, not membership, and the effect below it is still an unconditional keyed write, so it stays idempotent regardless of what the guard is checking."
  - line: 149
    label: clean
    window: 0
    reason: "hard clean: `install_dependencies` performs an effect inside a loop, which reads as accumulation, but each iteration goes through `ensure_plugin_slot`, which guards its own push."
  - line: 156
    label: clean
    window: 0
    reason: "hard clean: `ensure_plugin_slot` pushes onto the same kind of array `register_hook` does, guarded by `load_order.contains(name)` with an early return -- the canonical correct shape."
  - line: 164
    label: clean
    window: 0
    reason: "hard clean: `setup_defaults` writes three fields by assignment; a second call with the same arguments writes the same three values."
  - line: 171
    label: clean
    window: 0
    reason: "hard clean: `setup_stages` pushes in a loop, but onto a local array it then assigns to `defaults.stages`; the push accumulates within one call and never across calls."
  - line: 180
    label: clean
    window: 0
    reason: "hard clean: `setup_retry_budget` writes `defaults.retries = attempts + 1`, a value computed from the argument rather than from the field's own previous value -- one character of difference from the increment in `setup_metrics` below it."
  - line: 186
    label: bad
    window: 0
    reason: "`setup_metrics` assigns one field (safe) and increments another, `metrics.boots = metrics.boots + 1`, so the second call leaves 2 where the first left 1. One unsafe step is enough."
  - line: 192
    label: bad
    window: 0
    reason: "boundary defect: `register_login` wraps the same unconditional increment `setup_metrics` above performs in `if name != \"\" { ... }`. The condition reads as a guard, so the shape looks like `register_boot`'s, but it tests the argument's validity, not whether this name was seen before -- a repeat call with the same non-empty name takes the increment branch again every time. The inverse of `upsert_theme`, where an input-validity guard was harmless because the effect beneath it was already idempotent; here the effect beneath it is not."
