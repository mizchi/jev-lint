  - line: 75
    label: clean
    window: 0
    reason: "true, and terse."
  - line: 81
    label: clean
    window: 0
    reason: "boundary, arguable: \"refreshed\" reads two ways -- pulled from some external source (false, there is none) or read fresh with nothing cached (true: `entries.size()` is a direct call every time). Judged clean under the reading the code invites, the same reading `size` two matches below it earns for being a cheap, non-walking check. Residue: the external-refresh reading is real and a reviewer could file this as a defect."
  - line: 87
    label: clean
    window: 0
    reason: "hard clean: the captured comment is the `///|` separator, which claims nothing; the claim two lines up (`the map knows its own size`) is true of the body."
  - line: 93
    label: clean
    window: 0
    reason: "hard clean: the doc explains WHY, and the why is true of the body."
  - line: 103
    label: clean
    window: 0
    reason: "boundary, arguable: says it forwards to `size`, but it never calls it -- it computes `entries.size() > 0` directly. Judged clean because that expression is exactly what calling `size(entries) > 0` would evaluate to; the claim is false about implementation but not about the observable answer. Residue: a literal reading of \"forwards to\" as \"calls\" is defensible and would flag this."
fixtures/retry.mbt:
  - line: 10
    label: bad
    window: 0
    reason: "the doc says it retries up to `policy.tries` times; the body calls the effect once and never reads `tries`."
  - line: 16
    label: bad
    window: 0
    reason: "the doc says the delay doubles and is capped at a minute; the body multiplies by the attempt and caps nothing."
  - line: 22
    label: bad
    window: 0
    reason: "boundary: the cap only fails exactly where it is supposed to act -- every attempt at or under 10 is a plain linear multiply, correct and unremarkable, and the one branch meant to enforce \"capped at ten steps\" multiplies by 11 instead of holding at 10, so the delay promised never to grow past step ten does, by exactly one step, for any attempt past it."
  - line: 32
    label: clean
    window: 0
    reason: "hard clean: a doc that states the obvious about a one-line body is not a false claim."
  - line: 38
    label: clean
    window: 0
    reason: "boundary, arguable: \"several\" and \"short\" are adjectives, not numbers -- the doc makes no specific claim a reader could pin down as false, and 3 tries at 200ms each is a defensible reading of both words next to `once` (1 try, 0ms) and `backoff`'s minute-scale delays elsewhere in the file. Residue: a reader who treats \"tuned for network calls\" as a claim this struct alone cannot establish would call it unverifiable rather than clean."
  - line: 3
    label: clean
    window: 0
    reason: "the struct's fields are what the doc names."
  - line: 44
    label: clean
    window: 0
    reason: "a policy of one try is a policy that gives up immediately."
