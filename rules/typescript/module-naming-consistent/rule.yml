# --------------------------------------------------------------------------
# 6. Do this module's exports name the same kind of operation consistently?
# --------------------------------------------------------------------------
# A linter needs the convention written down first. This rule reads it off
# the file: the outline carries every export's signature, so getUser /
# fetchOrder / loadCart / retrieveInvoice for four identical lookups is
# visible in one state, and a sync get beside an async fetch is not a
# mismatch because the signatures say why. Built and measured in
# experiments/reports/e-file-consistency/: precision 1, recall 1 on
# 19 modules (6 defective), first on `full` because the outline had no
# signatures, then on `graph` once it did -- gap 0.31, midpoint 0.60, at a
# quarter of the tokens. `severity: info`: on an unseen repository it fired
# twice, once on an 18,000-line file nobody could judge. Its sibling
# sibling-deviates (one export breaks a pattern the rest follow) separates
# only as a `score` and only for signature-level deviations; it stays in the
# experiments directory.
id: module-naming-consistent
languages:
  - TypeScript
  - Tsx
  - JavaScript
  - Jsx
kind: noul
subject: file
state: graph
axis: file
at: 0.6
rule:
  kind: program
ask: This module's public items use different verbs for the same kind of operation.
criteria:
  "true": "Two or more public items do the same kind of thing -- the same
    operation applied to different nouns, with the same shape of signature --
    yet their names use different verbs for it: synonyms such as get, fetch,
    load and retrieve for identical lookups; create, make, new and build for
    identical constructors; set, update, change and modify for identical
    setters; send beside dispatch for identical deliveries; or a function that
    returns a boolean answer like its siblings but is named with a command verb
    (check, verify, validate) where the siblings are named is, has or can. Swap
    the nouns and the items would be interchangeable; only the verb differs."
  "false": "Every difference in verb marks a difference in what the item does, and
    the difference is visible here: a synchronous read from a cache beside an
    asynchronous fetch over the network, a lookup by id (get) beside a search by
    criteria (find), a conventional inverse pair such as parse/stringify or
    encode/decode, or verbs naming distinct operations such as create, cancel
    and list. A module with one public item, or whose public items each do a
    different thing, has nothing to be inconsistent about."
note: Judge the public items against each other. Private helpers, imports and
  call edges are evidence of what each public item does, not subjects. Different
  nouns are expected; the question is only whether the verbs disagree about the
  same operation.
severity: info
