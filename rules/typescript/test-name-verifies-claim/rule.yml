# 3b. Granted it is about the right thing -- does it actually establish it?
id: test-name-verifies-claim
languages: [ TypeScript, Tsx, JavaScript, Jsx ]
kind: noul
subject: node
# `bare` -- the cheapest arm, because this subject already contains both
# things being compared: the matcher captures the title and the body, so the
# file adds no evidence.
#
# INHERITED, not measured for this rule -- see the same note on
# `test-name-describes-code` above. docs/data/arms.json covers the pre-split
# `test-name-matches-body`, not this rule, and this is the rule holding most
# of the residue on real code, so the inheritance is worth closing.
#
# Staying on `bare` buys something the wider margin does not: a verdict that
# depends on nothing outside the test itself. Editing an unrelated test in the
# same file cannot change this one's answer, and cannot invalidate its cached
# verdict either.
state: bare
# The false branch names what a title does NOT claim, and it has to. On the
# original four defects this rule separated at 0.53; the tests pack's corpus
# added eleven defects and three hard cleans whose titles claim nothing
# ("matches the snapshot", "renders", "renders the receipt for a single-item
# order") over a snapshot assertion, and the rule read those at 0.69-0.77,
# inside its defect band -- precision 0.93 at any cutoff. Telling the
# criteria that a snapshot establishes a snapshot claim, and a call
# assertion an interaction claim, put the three at 0.4 and under and the
# fourteen defects at 0.53 and over: precision 1, recall 1, midpoint 0.51.
# 0.52 rather than the midpoint: the quietest defect ("hides the discount
# row when no discount applies", snapshot only) answers 0.53-0.56 across
# passes, and the cutoff has to sit under its band.
#
# Re-measured on evals/ after the suite grew to 31 defects and 52 cleans
# (16 labelled hard) and a note was added -- see the note below. With it,
# every defect but one answers 0.76 and up and every clean but one 0.44 and
# under. The two exceptions were the closest pair: profile.test.ts:164, a
# label-only snapshot title ("matches the snapshot with a pending email
# change") that the model half-reads as a claim about the pending email,
# and inventory.test.ts:77, a title saying "reserves" over a body that
# restocks, which `test-name-describes-code` catches at 0.89 and this rule
# half-catches. 0.62 chose precision: the clean was passed with room to
# spare, the adjacent-name defect left to the other rule.
#
# 2026-09-22, moved to 0.66. The suite has grown again since the paragraph
# above (as of this baseline, profile.test.ts:164 answers a mean of 0.5767,
# passes 0.60/0.55/0.58, spread 0.05; inventory.test.ts:77 answers a mean
# of 0.7567, passes 0.76/0.79/0.72, spread 0.07) -- the same closest pair,
# further apart than they were, but at 0.62 the clean's FP-margin (0.04)
# was still under its own spread, so `eval --replay`'s interval-aware fit
# called the suite unstable: a pass this corpus already produced (0.60)
# very nearly crosses 0.62. 0.66 clears profile.test.ts:164 by 0.0833 and
# inventory.test.ts:77 by 0.0967, both past their own spreads. Same 37
# defects caught, same 0 false positives.
#
# 2026-09-24, kept at 0.66 with a note paragraph on three more assertions.
# On an unseen front-end suite the rule read screenshot tests, accessible-name
# queries and not-throw tests whose names claimed exactly that as unproven.
# fixtures/panel.test.ts and fixtures/sparkline.test.ts hold those shapes, 6
# defects and 7 cleans; before the paragraph the two screenshot cleans
# answered 0.76-0.78 and the accepts-a-config clean 0.75, all flagged. Four
# wordings were measured. Naming the canvas ink check too, or saying the
# paragraph was "not a text or DOM snapshot", pulled the snapshot cases of the
# paragraph above: profile.test.ts:164 rose to 0.71 and two snapshot defects
# fell under the cutoff. Leaving the accessible-name sentence out sent
# panel.test.ts:27 from 0.15 to 0.61-0.67 across runs. The three sentences as
# written, five passes: 43 defects, 50 cleans, P 1 R 1, no flips; the loudest
# clean is still profile.test.ts:164 at 0.58 (0.55-0.61), the quietest defect
# inventory.test.ts:94 at 0.72 (0.71-0.73); the fitted midpoint is 0.66.
threshold: 0.66
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: warning
# One test call in any of the frameworks src/testcalls.ts knows -- jest,
# vitest (in-source included), node:test, Playwright, Deno.test, bun:test --
# with the title as $TITLE. A todo without a body is not matched.
rule:
  matches: jev-test-call
ask: >-
  This test would still pass if the behaviour its name claims were broken.
# The note is what moved the label-only snapshot cleans ("renders", "matches
# the snapshot for a three-item order") from 0.50-0.55 to 0.32-0.41 while
# keeping the snapshot-under-a-claim defects at 0.55-0.76. Two things were
# tried and measured worse: a criteria rewrite that spelled the snapshot
# reasoning out in the true branch lifted EVERY snapshot test to 0.59-0.76,
# label-only ones included; and rephrasing the ask as "the assertions do
# not establish what the name claims" made "renders the error state when
# the request fails" read as a label (0.48, a miss) and two exact-order
# cleans wobble to 0.48-0.49. A longer note naming "with/for/of some state"
# as input-labelling lifted the Rust label-only cleans to 0.50-0.54.
note: >-
  Two things to read for. A snapshot records whatever the output was: under a
  name that claims a specific property of the output (a row hidden, a footer
  omitted, a hint shown, a format) it establishes nothing about that property,
  while under a name that only says renders, or snapshot, or labels the variant
  rendered, it is the whole claim. And a body whose named operation is never
  called, or whose named case is never set up, establishes nothing however exact
  its assertion is.

  Three more, for assertions that are not a snapshot of text. A screenshot
  comparison (toHaveScreenshot) against a baseline image a person reviewed is
  the assertion under a name claiming what is visibly on screen in a state the
  body sets up; it shows nothing a picture cannot, such as a request or a
  stored value. A query by accessible name, getByRole(role, { name }), that
  has to succeed establishes that the element exposes that name. And when the
  name claims only that something does not fail -- it completes without
  throwing, it accepts an input -- an assertion that it does not throw
  establishes it.
# The paragraph above is this copy's alone. Screenshot comparisons,
# accessible-name queries and not-throw assertions are how TypeScript
# front-end tests are written; the
# Rust, Go and MoonBit suites have no such idiom, and their corpora have no
# case that would measure the wording.
divergent: >-
  The TypeScript note adds a paragraph on screenshot comparisons,
  accessible-name queries and not-throw assertions, test idioms the other
  languages' suites do not have.
criteria:
  "true": >-
    The body does not establish what the name claims: it asserts nothing at all,
    it asserts something that would hold whether or not the named behaviour
    worked, it checks an incidental property such as a length or a type instead
    of the named behaviour itself, or it never sets up the case the name is
    about so the assertion never exercises it.
  "false": >-
    The body contains at least one assertion that would fail if the named
    behaviour were broken. Read the name for what it actually claims: a name
    that claims only that something renders, or that the output matches a
    snapshot, or that only labels the input the snapshot was taken of, is
    established by the snapshot; a name that claims an interaction with a
    collaborator -- that something was called, once, with these arguments -- is
    established by an assertion on that call.
