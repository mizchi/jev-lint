    reason: "nothing here configures anything -- it takes a cart and returns the sum of five unrelated numbers. This label was added AFTER the first run, which flagged this function at 0.83 while the corpus called it clean. It is a defect I wrote by accident while building a container for the variable cases below, and the honest reading is that the rule found it and I had not. Relabelling to agree with a model is how a corpus stops being evidence, so the justification has to stand on its own -- and it does: a reader of this signature learns nothing true about the body. The false positive that prompted it is recorded in docs/findings.md."
