fixtures/session.ts:
  - line: 45
    label: bad
    window: 0
    reason: "`summarize` promises a summary of the session it is given; it returns an arbitrary sum of three unrelated numbers, one of which ignores the session entirely. This is the THIRD time a container function written to host the variable cases below turned out to be a naming defect itself (see `configure` in cart.ts and `summarize` in backoff.rs). Each one was flagged by the rule and labelled clean by me, and each time the rule was right. The pattern is worth naming: a function written only to hold other code has no job to be named after, so it cannot be named honestly -- which is exactly the defect. It also shows up in the numbers: with this mislabelled, the fitted cutoff was 0.87 and the clean band appeared to reach 0.81; corrected, the highest clean answer is 0.44. See docs/findings.md."
