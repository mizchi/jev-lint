id: interface-segregation
language: Text
extensions:
  - isp
subject: block
state: bare
kind: noul
severity: info
threshold: 0.49  # Three-pass fixture fit: defects 0.91–0.92, clean max 0.06, maximum within-case spread 0.02.
ask: Does the required interface force the shown client or its provider to
  supply an operation for another role that its own job cannot meaningfully
  implement?
criteria:
  "true": Connect a required member to a concrete burden such as a dummy method,
    unsupported operation or unrelated dependency that the consumer must provide
    solely to satisfy this contract.
  "false": A broad interface, an optional capability, a test double standing in
    for a real operation, or a caller using a subset of members alone is
    insufficient.
category: advisory
nextCheck: Trace the required member from the consumer to the provider stub. Try
  a type containing only the operations this role calls and check whether
  another promised operation breaks.
split: ^Revision [0-9a-f]{40}$
