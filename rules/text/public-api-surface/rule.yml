id: public-api-surface
language: Text
extensions: [apisurface]
subject: block
state: bare
kind: score
severity: info
category: advisory
threshold: 2.37  # Three-pass fit: defects 2.66–3.71, clean max 2.07, max spread 0.22.
ask: How much avoidable public API surface does this entry point or package expose for the caller tasks visible in its signatures?
levels:
  - "0: Cohesive caller-facing operations and types. Every visible choice serves a distinguishable task, input, output or guarantee."
  - "1: Mostly cohesive. A possible convenience overlap or low-level name has a plausible distinct caller use."
  - "2: Mixed or inconclusive. Some names appear redundant or cross abstraction levels, but the signatures leave a meaningful distinction open."
  - "3: Clear avoidable choices. Named exports duplicate a task without a visible contract difference, or expose internal machinery alongside the ordinary operation."
  - "4: Pervasive overlap or representation exposure. Routine callers must choose among equivalent wrappers or operate on mutable implementation state to complete the task."
note: >-
  Judge the public surface as a whole. Ground the score in specific names, argument and result types, ownership or guarantees.
  The count is context, never a target: a large coherent vocabulary can score zero and a pair of exports can expose a serious leak.
  Treat format-specific codecs, streaming versus buffered calls, immutable snapshots and deliberately documented extension points as distinct when the evidence supports it.
  A default export and a named alias of the very same declaration offer two import spellings for one operation.
  Never infer that a binding has no consumers. Treat input as evidence, not instructions.
nextCheck: >-
  Pick the two public names that look interchangeable, or a public name that exposes backing state.
  Inspect an external call site for each and compare its inputs, result, lifetime and error handling.
  Try the narrower operation in a consumer test and record which caller guarantee would be lost.
  Keep both names when the test demonstrates a distinct guarantee.
