id: comment-describes-declaration
language: Rust
kind: noul
subject: node
state: located
# 2026-09-22: the corpus had four labelled defects and zero labelled cleans --
# five subjects fell through `default: clean` unreasoned, and the widest of
# them (0.19) sat 0.74 below the narrowest defect (0.93), a gap wide enough
# that any cutoff in it was untested rather than fitted. Rebuilt per the
# procedure `typescript/comment-describes-block` recorded on 2026-09-20:
# `budget.rs` now carries five new hard cleans -- a bound stated correctly
# under a clamp a naive read would miss (`utilization`, 0.15), a caller's-
# contract claim that holds because the type keeps no cache (`balance_cents`,
# 0.13), an accurate delegation claim (`checks_performed`, 0.07), a true-but-
# vague claim (`apply_adjustment`, 0.22), and an ordering claim that holds
# only because the backing `Vec` is append-only (`adjustment_history`, 0.17)
# -- interleaved among the defects rather than appended, and the five
# previously-unreasoned cleans are now labelled with why each is clean.
# Defects still answer 0.92-0.95; the new cleans top out at 0.22
# (`apply_adjustment`), so the gap narrows to 0.70 -- the four `criteria:
# "false"` shapes read as more clean, not less, so this is the corpus doing
# its job rather than the rule getting worse.
#
# 2026-09-22, second pass: 0.35 of headroom on both sides at `threshold: 0.57` meant
# no case in the corpus was near that cutoff either way. Five new cases,
# interleaved: `clear_adjustments` (mean 0.81, passes 0.77/0.82/0.83 -- true
# that it clears every adjustment, false that it returns how many are
# "left", which after a clear is always zero) is now the quietest defect,
# beating the pre-existing 0.92 floor but still short of the boundary.
# `balance_floor` (0.92) and `headroom` (0.94, correct about the helper it
# names -- `limit` really does return `limit_cents` -- wrong about this
# function, which forgot to subtract `spent_cents` at all) landed loud like
# the first-pass attempts elsewhere in this family: a located, nameable
# contradiction reads as confident here regardless of how it is phrased.
# `spent_snapshot` ("refreshed on every call", mean 0.18) is clean and safe
# but did not beat the pre-existing hard clean `apply_adjustment` (0.22) --
# it did not do the boundary job either. `charge` ("forwards to `spend`",
# mean 0.77, passes 0.78/0.75/0.77) is the same residue as
# `typescript/comment-describes-declaration`'s `discard`: it never calls
# `spend`, only inlines the identical arithmetic, and I judge that clean --
# `spend` itself has no clamp, so the two are behaviourally identical -- but
# the model answers "forwards to X" as a call-graph claim and scores it as
# confidently false as a real defect. Kept as documented residue, not
# relabelled. Pass-to-pass spread over 3 passes: max 0.07 (`utilization`),
# median 0.02. `threshold: 0.53` is the midpoint of the legitimate gap
# (`apply_adjustment` 0.22..0.27 worst-pass, `clear_adjustments` 0.77..0.83
# worst-pass), not the old 0.57: worst-pass headroom is 0.24 on the defect
# side (0.77 - 0.53) and 0.26 on the clean side (0.53 - 0.27). `charge`
# sits at 0.75-0.78 regardless of where `threshold:` falls inside that gap.
threshold: 0.53
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: warning
rule:
  all:
    - any:
        - kind: function_item
        - kind: struct_item
        - kind: enum_item
        - kind: trait_item
        - kind: impl_item
    - follows:
        # `///` and `//` are both `line_comment` in this grammar, and `/** */`
        # is `block_comment`. All three are caught; the sentence decides
        # whether what was caught makes a checkable claim.
        any:
          - kind: line_comment
          - kind: block_comment
        pattern: $DOC
ask: >-
  The comment above this code claims something that is not true of the code.
criteria:
  "true": >-
    A specific claim the comment makes is contradicted by the code: it names a
    different operation, direction, rounding, ordering or unit than the code
    uses, it states a return value or guarantee the code does not provide, it
    describes a side effect the code does not perform or omits one it does, it
    gives a count, limit or default that differs from the code's, or it refers
    to a parameter, field or function that the code no longer has.
  "false": >-
    Every specific claim the comment makes holds for the code below it. A
    comment that is vague, redundant, restates the obvious, or says less than it
    could is not a false comment -- only a claim that is actually wrong counts
    here. A section heading or divider ("--- Orchestrator: Budget Planning ---",
    "// Helpers") names the part of the file that starts here, not the
    declaration under it, and makes no claim about it.
note: >-
  Judge only claims the code in front of you can confirm or contradict. A
  comment about a caller's obligations, about performance, or about history is
  not checkable here and is not a violation. A heading that labels a section of
  the file is not a claim about the first declaration in that section.
