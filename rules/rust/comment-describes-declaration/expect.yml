  - line: 64
    label: clean
    window: 0
    reason: "boundary, arguable: \"refreshed\" reads two ways -- renewed from some external source (false, there is none) or read fresh with nothing cached (true: it is a direct field read on every call). Judged clean under the reading the code invites, matching how `balance_cents`'s own comment uses \"no cache\" three matches above it. Residue: the external-refresh reading is real and a reviewer could file this as a defect."
