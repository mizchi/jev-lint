    reason: "boundary, arguable: says it forwards to `spend`, but it never calls `self.spend(...)` -- it inlines the identical `self.spent_cents += cents` and then computes the balance directly instead of calling `balance_cents`. Judged clean because `spend` itself has no clamp (see its own comment bug below), so the two operations produce identical state and an identical return value to what calling `spend` then `balance_cents` would give; nothing here names a method the type lacks. Residue: a literal reading of \"forwards to\" as \"calls\" is defensible and would flag this."
  - line: 59
