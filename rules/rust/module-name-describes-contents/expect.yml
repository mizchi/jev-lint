default: clean
fixtures/backoff.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named `backoff` and every public item is about backoff. The Rust half of the hard-clean class described at the top of corpus/ts/session.ts. Names here are defensible rather than obvious: a predicate that needs an inference, a mutation that announces itself, a parse that can fail, a `get` that computes. The corpus had none of these and a cutoff fitted without them sat too close to the boundary."
fixtures/utils.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: "`utils` describes nothing: a clamp and a string repeat have no more in common than that someone had nowhere else to put them. Ported from moonbit's util.mbt, the quietest labelled defect in that sibling corpus (0.63 against a 0.55 cutoff) -- unlike helpers.rs, where every item shares one nameable concern (currency) and the mismatch is loud, `clamp` and `repeat` are each individually a plausible thing for a generic-utility module to hold, so the placeholder name is harder to convict on sight."
fixtures/budget.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named for the budget it tracks. The Rust half of the comment-drift corpus. See corpus/ts/session_store.ts for what the CLEAN cases are doing there: a vague, redundant or why-not-what comment is accurate and must not be flagged, because the axis is whether the claim is false, not whether the comment is worth having."
fixtures/helpers.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: every public item here is about formatting and parsing currency, and the module is called `helpers`.
fixtures/queue.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named `queue` and holds a priority queue plus `depth`/`uptime`, which report the queue's own size and age -- a queue reporting on itself, not an unrelated concern smuggled in."
fixtures/cart.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named for the cart it holds: a line-item total and how to add to it. Ported from moonbit's cart.mbt, the loudest labelled clean in that sibling corpus (0.22 against a 0.55 cutoff) -- the module's own type is called `Line`, not `Cart`, so the name doesn't repeat verbatim anywhere in the file, only the concern the items serve does."
fixtures/session.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: "named `session` and does hold session lifecycle (create/refresh/invalidate), but half its public surface -- `hash_password`, `verify_password` -- is password hashing, a distinct concern that belongs to an `auth` or `password` module, not to session management. Aimed at the boundary: unlike helpers.rs, the on-topic half is real and dominant-looking at a glance."
fixtures/retry.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: the module is called `retry` and every public item is about retrying.
fixtures/catalog.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "`catalog` is broad rather than narrow, but `Category`, `Product`, lookup by category and discount pricing are one cohesive commerce concern a shopper would expect under that name -- broad and cohesive, not broad and scattered."
fixtures/metrics.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: "named `metrics` and mostly holds `Counter`/`Gauge`, but `retry_delay` computes a backoff schedule -- observability and a retry policy are unrelated concerns sharing one file. Aimed quiet: it is a single stray export among several on-topic ones, the shape that stayed hard to convict in the sibling moonbit/typescript corpora."
fixtures/inventory.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: "named `inventory` and mostly holds stock adjustment/reservation, but `format_price` is currency formatting -- unrelated to tracking stock levels, and, like metrics.rs, a single off-topic export rather than a wholesale mismatch."
fixtures/notifications.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named `notifications` and `render_template` renders the message body the send functions dispatch -- composing the notification's content is part of the notifications concern, not an unrelated utility that happens to sit here."
fixtures/orders.rs:
  - line: 1
    label: clean
    window: 1000000
    reason: "named `orders` and holds order creation, cancellation, an event log and history lookup -- several distinct-sounding items (`Order`, `OrderEvent`, history) that are all one order-lifecycle concern, not a name that is narrower than what it holds."
fixtures/billing.rs:
  - line: 1
    label: bad
    window: 1000000
    reason: "named `billing` and does hold invoice creation/payment/void, but `EmailAddress` and `send_email` are notification delivery, not billing -- two of five public items off-topic rather than one, aimed between session.rs's half-and-half split and metrics.rs/inventory.rs's single stray export."
