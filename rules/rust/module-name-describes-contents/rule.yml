id: module-name-describes-contents
language: Rust
kind: noul
subject: file
state: graph
# 0.55, kept after growing the corpus 2026-09-22 from 2 defects/4 cleans to
# 6 defects/8 cleans (14 files, 3 passes), no longer thin. The graph arm
# only ever sees imports and a symbol table -- no bodies -- so every new
# case had to put its ambiguity in which symbols a module exports, not in
# what they do.
#
# Loud defects still separate cleanly: helpers.rs 0.82-0.84 and utils.rs
# 0.80-0.82 (grab-bags with no dominant concern -- see below), then
# session.rs 0.60-0.67 and billing.rs 0.59-0.63, where a clear majority of
# the surface is on-topic (session lifecycle; invoicing) but a second,
# unrelated concern rides along on two-fifths to half of the public items
# (password hashing; notification delivery). billing.rs is the quietest
# defect the rule still catches -- margin 0.06 over the cutoff, but a
# stable decision across all 3 passes (0.59/0.61/0.63, never crosses back).
#
# Two defects the rule misses at any workable cutoff: metrics.rs (Counter
# and Gauge plus one stray retry_delay, 0.16-0.19) and inventory.rs (stock
# tracking plus one stray format_price, 0.30-0.36). A single off-topic
# export riding along on several on-topic ones reads to the model as
# within-cohesion -- the same leniency the rule's own note grants a module
# for holding several related items, just extended to cover one unrelated
# one too. No cutoff rescues these without also catching catalog.rs
# (0.16-0.21, clean: Category/Product/discount pricing, one cohesive
# commerce concern despite three distinct-sounding items) and cart.rs
# (0.16-0.19, clean), which sit in the same band -- metrics.rs's own mean
# (0.17) and cart.rs's (0.18) interleave. This is a demonstrated blind spot
# of the graph arm, not a threshold to chase: the rule currently cannot
# tell "one stray export" from "one more facet of a cohesive module."
#
# Cleans top at catalog.rs (0.18 mean, edging out cart.rs); orders.rs, a
# broad-but-cohesive order-lifecycle module built specifically to tempt
# over-triggering (Order, OrderEvent, history, several distinct-sounding
# items), stayed at 0.07. FP headroom (loudest clean to cutoff) is 0.37;
# FN headroom among caught defects (cutoff to quietest catch) is 0.06 --
# the asymmetry is real and points at what to test next, not at moving
# 0.55: nothing below ~0.17 would reach metrics.rs, and a cutoff that low
# sits inside the clean band (cart.rs, catalog.rs) and would wreck
# precision (still 1.00 here, including against three fixtures built
# adversarially to be clean-but-tempting) without fixing the blind spot.
threshold: 0.55
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: info
rule:
  kind: source_file
ask: >-
  This module's name does not describe what the module contains.
criteria:
  "true": >-
    The filename and path name a subject that the module's public items do not
    match: the items belong to a different concern than the name states, the
    name names one thing while the module holds an unrelated assortment, the
    name is narrower or broader than the items it holds, or the name is a
    placeholder such as utils, helpers, misc, common or manager for items that
    share a concern that could be named.
  "false": >-
    The filename and path describe what the module's public items are about,
    closely enough that someone looking for those items would look here.
note: >-
  A module holding one cohesive group of items is not a mismatch merely for
  holding several of them, and a conventional entry-point name (index, mod, lib,
  main) is named by its directory rather than by itself.
