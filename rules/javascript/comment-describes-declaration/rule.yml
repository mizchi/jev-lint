id: comment-describes-declaration
languages:
  - JavaScript
  - Jsx
kind: noul
subject: node
state: located
# 2026-09-22: `legacy_cart.js` had two labelled defects and two unlabelled
# `default: clean` cleans that made no checkable claim ("Returns the number
# of items whose price is above zero", "Empties the cart") -- true, but not
# hard: a claim nobody could have gotten wrong is not a negative class.
# Rebuilt per the procedure `typescript/comment-describes-block` recorded on
# 2026-09-20: five new hard cleans, interleaved among the defects rather than
# appended after them -- an ordering-plus-tie-break claim that holds only
# because of the explicit index tie-break (`cheapestFirst`, 0.28), a caller's-
# contract claim that holds because the count is read fresh with no cache
# (`itemCount`, 0.07), a true-but-vague claim (`applyDiscount`, 0.13), an
# accurate delegation claim independent of the callee's own doc bug
# (`roundedTotal`, 0.20), and a bound claim that holds only because of an
# explicit clamp and a zero-length guard (`paidShare`, 0.07). Defects still
# answer 0.94-0.96; the new cleans top out at 0.28 (`cheapestFirst`), so the
# gap narrows from 0.72 (pre-existing baseline: cleanTop 0.19, defectMin
# 0.91) to 0.66. Pass-to-pass spread over 3 passes: max 0.13 (`cheapestFirst`,
# 0.21/0.28/0.34), median 0.01 -- even at its high pass `cheapestFirst` stays
# 0.27 under the cutoff. `at: 0.61` is the fitted midpoint of (0.28, 0.94);
# headroom is 0.33 on both sides.
at: 0.61
# Calibrated on the file axis; pinned so the scheduler cannot move it.
axis: file
severity: warning
rule:
  any:
    - all:
        - any:
            - kind: function_declaration
            - kind: class_declaration
            - kind: method_definition
        - follows:
            kind: comment
            pattern: $DOC
    - all:
        - any:
            - kind: function_declaration
            - kind: class_declaration
        - inside:
            kind: export_statement
            follows:
              kind: comment
              pattern: $DOC
ask: >-
  The comment above this code claims something that is not true of the code.
criteria:
  "true": >-
    A specific claim the comment makes is contradicted by the code: it names a
    different operation, direction, rounding, ordering or unit than the code
    uses, it states a return value or guarantee the code does not provide, it
    describes a side effect the code does not perform or omits one it does, it
    gives a count, limit or default that differs from the code's, or it refers
    to a parameter, field or function that the code no longer has.
  "false": >-
    Every specific claim the comment makes holds for the code below it. A
    comment that is vague, redundant, restates the obvious, or says less than it
    could is not a false comment -- only a claim that is actually wrong counts
    here. A section heading or divider ("--- Orchestrator: Budget Planning ---",
    "// Helpers") names the part of the file that starts here, not the
    declaration under it, and makes no claim about it.
note: >-
  Judge only claims the code in front of you can confirm or contradict. A
  comment about a caller's obligations, about performance, or about history is
  not checkable here and is not a violation. A heading that labels a section of
  the file is not a claim about the first declaration in that section.
