name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.plan.outputs.filename }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require a main-branch release with matching versions and notes
        id: plan
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node --experimental-strip-types tools/release.ts "$GITHUB_REF_NAME" --out-dir release
      - run: npm ci
      - run: npm run ci
      - run: npm run test:package -- --out-dir release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release/
      - run: npm install --global npm@11.19.1
      - name: Reject a release that would move its channel backward
        run: |
          npm view jev-lint dist-tags --json > "$RUNNER_TEMP/channels.json"
          node --experimental-strip-types tools/release.ts "$GITHUB_REF_NAME" --check-channel "$RUNNER_TEMP/channels.json"
      - name: Publish the tested tarball through npm OIDC
        env:
          PACKAGE_FILE: ${{ needs.prepare.outputs.filename }}
          DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
        run: npm publish "release/$PACKAGE_FILE" --access public --tag "$DIST_TAG" --ignore-scripts

  github-release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: release/
      - name: Create the GitHub release from the same changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_FILE: ${{ needs.prepare.outputs.filename }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "release/$PACKAGE_FILE" \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release/release-notes.md "${flags[@]}"
