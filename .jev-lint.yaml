# jev-lint's own configuration: the tool over its own source. A flag of the
# same name overrides a setting here.

# test/fixtures holds planted defects for the cookbook test, so it is
# carved out of test/, which is otherwise the suite.
#
# `docs` and `AGENTS.md` are here so the markdown rules have something to
# read: without them every run printed `no files for markdown (11 rules)`,
# which is eleven rules carried and never once asked. AGENTS.md is also
# what `commits` judges a change against, so it is the one file in this
# repository that has to be true about the others.
files: [src, tools, test, docs, AGENTS.md, package.json]
#
# docs/internal is the working shelf -- plans, specs, the findings
# notebook, the architecture notes, a blog draft -- and it is excluded
# because the prose pack is calibrated on documents meant to be read.
# `section-opens-with-an-agenda` asks a section to open with a stance
# rather than a list of what it will cover: fair of a published document,
# wrong of a plan, whose whole job is to be that list. Eight of the nine
# findings on the first pull request were this one rule on those files.
# README.md's prior-art section says as much about where these rules came
# from: they read their norm's genre, and will flag a reference or a
# findings log for doing what a reference does.
exclude: [test/fixtures, docs/internal]

# Every shipped rule, on. Listed rather than defaulted, so that turning one
# off is a diff.
rules:
  catch-hides-failure: on
  class-shape-shows-its-role: on
  comment-describes-block: on
  comment-describes-declaration: on
  commit-message-describes-diff: on
  describe-names-subject: on
  destroys-beyond-its-scope: on
  doc-errors-match-body: on
  document-abandons-a-question: on
  document-is-filler: on
  document-is-formulaic: on
  document-is-generic: on
  document-is-incoherent: on
  document-is-padded: on
  document-is-slop: on
  document-is-vague: on
  document-lacks-firsthand-evidence: on
  error-message-matches-condition: on
  fn-name-promises: on
  hides-what-it-runs: on
  idempotent-name: on
  installs-persistence: on
  log-level-matches-event: on
  log-message-matches-event: on
  method-name-promises: on
  module-name-describes-contents: on
  module-naming-consistent: on
  must-name-panics: on
  opens-a-backdoor: on
  pure-name-is-pure: on
  query-name-describes-sql: on
  reads-secrets-it-does-not-own: on
  runs-downloaded-code: on
  safe-name-is-safe: on
  script-name-does: on
  section-ends-with-a-preview: on
  section-opens-with-an-agenda: on
  snapshot-only-behaviour-claim: on
  takes-remote-commands: on
  test-mocks-subject: on
  test-name-describes-code: on
  test-name-verifies-claim: on
  tests-cover-failure-paths: on
  trait-name-describes-methods: on
  type-name-describes-shape: on
  var-name-describes-value: on
  weakens-security: on

# The verdict cache, committed: a run over the same commit answers from it.
# cache: .jev-lint/baseline.json
