  typescript/var-name-describes-value: on
# Staged review inherits the ordinary rules. The change rule can judge the
# index; the commit-message rule has no message until pre-push.
hooks:
  precommit:
    extends: true
    rules:
      git/commit-message-describes-diff: on
      git/diff-follows-instructions: on
# The verdict cache, committed: a run over the same commit answers from it.
# cache: .jev-lint/baseline.json
