  python/test-name-describes-code: on
  python/tests-cover-failure-paths: on
  python/var-name-describes-value: on
  rust/comment-describes-block: on
  rust/comment-describes-declaration: on
  rust/doc-errors-match-body: on
  rust/fn-name-promises: on
  rust/module-name-describes-contents: on
  rust/test-name-describes-code: on
  rust/test-name-verifies-claim: on
