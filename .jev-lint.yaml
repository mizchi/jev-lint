# jev-lint's own configuration: the tool over its own source. A flag of the
# same name overrides a setting here.

# test/fixtures holds planted defects for the cookbook test, so it is
# carved out of test/, which is otherwise the suite.
files: [src, tools, test, package.json]
exclude: [test/fixtures]

# Every shipped rule, on. The markdown rules see no file here (docs/ is
# not in `files`), and are listed so that turning one off is a diff.
rules:
  catch-hides-failure: on
  comment-describes-block: on
  comment-describes-declaration: on
  commit-message-describes-diff: on
  describe-names-subject: on
  destroys-beyond-its-scope: on
  doc-errors-match-body: on
  document-abandons-a-question: on
  document-is-filler: on
  document-is-formulaic: on
  document-is-generic: on
  document-is-incoherent: on
  document-is-padded: on
  document-is-slop: on
  document-is-vague: on
  document-lacks-firsthand-evidence: on
  error-message-matches-condition: on
  fn-name-promises: on
  hides-what-it-runs: on
  idempotent-name: on
  installs-persistence: on
  log-level-matches-event: on
  log-message-matches-event: on
  module-name-describes-contents: on
  module-naming-consistent: on
  must-name-panics: on
  opens-a-backdoor: on
  pure-name-is-pure: on
  query-name-describes-sql: on
  reads-secrets-it-does-not-own: on
  runs-downloaded-code: on
  safe-name-is-safe: on
  script-name-does: on
  section-ends-with-a-preview: on
  section-opens-with-an-agenda: on
  snapshot-only-behaviour-claim: on
  takes-remote-commands: on
  test-mocks-subject: on
  test-name-describes-code: on
  test-name-verifies-claim: on
  tests-cover-failure-paths: on
  type-name-describes-shape: on
  var-name-describes-value: on
  weakens-security: on

# The verdict cache, committed: a run over the same commit answers from it.
# cache: .jev-lint/baseline.json
