name: Release

on:
  workflow_dispatch:
    inputs:
      level:
        description: semver level
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.level }} -m "chore(release): %s"
          git push --follow-tags

      - name: Type check
        run: npx eslint . --ext .ts,.tsx --max-warnings 0

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Notify
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "Released ${{ github.repository }}@${{ github.ref_name }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Clean up workspace
        run: |
          gh release create ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  docs:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish docs
        run: |
          npm ci
          npm run docs
          npx gh-pages -d docs -m "docs: ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Deploy
        run: |
          npm run build
          aws s3 sync dist/ s3://acme-dashboard-prod --delete
          aws cloudfront create-invalidation --distribution-id $CF_DIST --paths "/*"
        env:
          CF_DIST: ${{ secrets.CF_DISTRIBUTION_ID }}
