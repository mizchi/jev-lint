  - { line: 14, label: clean, window: 0, reason: "HARD clean, one line from two defects and inside the same deceptive case: `Thanks! Telemetry enabled.` is true -- the accurate branch of a dishonest prompt. If anything sets this rule's cutoff it is this line" }
