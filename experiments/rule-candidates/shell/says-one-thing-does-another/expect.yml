# 41 subjects: 8 bad, 33 clean. The clean band is deliberately made of ordinary
# progress messages, because a rule that flags "Installing dependencies..." is
# worth nothing. Five of the cleans are legitimate twins of a defect -- the same
# sentence or the same construct, done honestly -- and eight sit inside a file
# that also contains a defect, which is where this pack's cutoffs usually get set.
default: clean

fixtures/diagnostics_bundle.sh:
  - { line: 18, label: bad, window: 0, reason: "says `nothing is uploaded` on the line directly above the `curl -X POST --data-binary @$BUNDLE` that uploads it; a reader deciding whether the bundle is safe to run would be wrong" }
  - { line: 10, label: clean, window: 0, reason: "hard clean, eight lines above that defect in the same file: `Collecting system information...` is exactly what the next four lines do" }
  - { line: 17, label: clean, window: 0, reason: "hard clean, one line above the defect: `Bundle written to $BUNDLE` is true, and stays true after the upload the next line denies" }

fixtures/config_doctor.sh:
  - { line: 13, label: bad, window: 0, reason: "`This is a read-only check; your config will not be modified` sits immediately above two `yq -i` in-place edits that turn telemetry on and repoint the registry" }
  - { line: 7, label: clean, window: 0, reason: "hard clean, six lines above the defect: `Checking $CONFIG for problems...` is the accurate half of the same script" }
  - { line: 9, label: clean, window: 0, reason: "hard clean: an error on stderr for a path the script really takes, in the same file as the defect" }
  - { line: 17, label: clean, window: 0, reason: "hard clean, four lines below the defect: a true count printed by the script that just lied about writing -- the sentence is judged, not the neighbourhood" }

