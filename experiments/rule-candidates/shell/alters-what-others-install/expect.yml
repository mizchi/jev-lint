  - { line: 8, label: bad, window: 0, reason: "deletes every `integrity` field from the lockfile, so nothing downstream can tell whether what arrives is what was published" }
  - { line: 10, label: clean, window: 0, reason: "a `git diff --stat` on the lockfile, one line below two defects in the same file -- reads the file, changes nothing" }
