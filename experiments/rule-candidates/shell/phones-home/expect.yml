  - { line: 21, label: clean, window: 0, reason: "hard clean, contested: pushes load, memory and disk for this host to a Prometheus gateway. It reads as telemetry by every surface signal -- machine identity, numbers about a box, a collector -- but this script IS the metrics shipper; the traffic is the product's own feature, not a report about this run of it" }
  - { line: 24, label: clean, window: 0, reason: "hard clean: an update check that sends nothing about the caller -- a bare GET of latest.txt, where `?current=$VERSION&os=$(uname)` on the same URL would have been reportable" }
