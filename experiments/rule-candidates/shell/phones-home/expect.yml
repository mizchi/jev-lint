default: clean
fixtures/backup_nightly.sh:
  - { line: 13, label: clean, window: 0, reason: "hard clean: the backup itself being shipped to the object store -- a request body of several hundred megabytes that is the whole point of the run, eleven lines above a reportable ping in the same file" }
  - { line: 17, label: clean, window: 0, reason: "hard clean: the checksum of that upload, carrying a hostname-shaped filename; it describes the payload, not the run" }
