  - { line: 19, label: bad, window: 0, reason: "a wget whose entire purpose is the query string: job name, exit code, elapsed seconds and hostname posted to a beacon endpoint after every scheduled run" }
fixtures/deploy_service.sh:
  - { line: 10, label: clean, window: 0, reason: "hard clean: a POST with a JSON body to an external vendor -- and it is the deploy, the API this script exists to drive" }
  - { line: 17, label: clean, window: 0, reason: "hard clean: polls the release's state; the run is asking the service a question, not telling it one" }
  - { line: 22, label: clean, window: 0, reason: "hard clean: reads /healthz on the deployed service -- the health-check direction is inbound, which is the opposite of reporting to a collector" }
  - { line: 24, label: clean, window: 0, reason: "hard clean, and the arguable one: a webhook the operator configured against their own team's channel, posting a human-readable line about this deploy. It is about the run, which is why it is hard, but the recipient is the operator themselves and the payload is the script's output rather than an event a collector aggregates" }
fixtures/etl_nightly.sh:
  - { line: 9, label: clean, window: 0, reason: "hard clean: trap EXIT that removes the staging dir" }
  - { line: 10, label: bad, window: 0, reason: "a trap on ERR that posts an automated event -- summary, host, severity -- to a paging vendor's ingest endpoint when the run fails. I first labelled this clean, arguing it was the operator's own on-call rather than a collector; that is wrong on this rule's axis, which is that traffic saying the run failed on this machine is telemetry whoever receives it. The human-readable chat line in deploy_service.sh:24 is the clean side of that boundary and sits two lines of argument away" }
  - { line: 12, label: clean, window: 0, reason: "hard clean: pulls yesterday's orders with a query string -- inbound, and it is the extract half of the job" }
  - { line: 17, label: clean, window: 0, reason: "hard clean: --data-binary of the transformed rows into the warehouse; the load half of the job" }
