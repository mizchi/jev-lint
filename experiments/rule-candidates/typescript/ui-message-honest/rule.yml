# --------------------------------------------------------------------------
# 2. Does a message shown to the user say what the code actually did?
# --------------------------------------------------------------------------
id: ui-message-honest
languages: [ TypeScript, Tsx, JavaScript, Jsx ]
kind: noul
# `enclosing`, unlike the other two: whether "Saved" is honest is a fact
# about the whole flow, and judging the function with the message as the
# matched piece kept the enqueue-then-"Saved" case at 0.88 where `node`
# dropped it to 0.53. Since the promoted-subject key includes the match,
# two messages in one function are two questions; the evals now hold
# "Saving…"/"Saved", a bad success toast beside its honest .catch, and a
# progress message beside an enqueue-only "finished", each judged on its own.
#
# Re-derived (experiments/reports/improve-ui-message-honest): 55 subjects,
# 17 bad, 38 clean. Bad band 0.76-0.94, clean band 0.06-0.50, fitted
# midpoint 0.63, 0 flips over 3 passes. The one class that used to miss --
# a specific cause named for a branch that other causes also reach, outside
# a catch -- is now in the criteria and answers 0.86-0.88.
subject: enclosing
state: local
at: 0.63
rule:
  any:
    # toast("..."), notify("..."), alert("..."), showMessage("..."),
    # setStatus("..."), setMessage("..."), setNotice("...")
    - all:
        - any:
            - pattern: $FN($MSG, $$$REST)
            - pattern: $FN($MSG)
        - has:
            field: function
            # React state setters by prefix: `setNotice`, `setBanner`, `setStatusText`
            # all carry a message; an exact list missed most real names.
            regex: "^(toast|notify|alert|showMessage|showToast|showNotification|showAlert|e\
              nqueueSnackbar|set(Status|Message|Msg|Error|Success|Feedback|Noti\
              ce|Banner|Toast|Flash)\\w*)$"
    # toast.success("..."), message.error("..."), notification.open("...")
    # `message` is also a common string variable; its string methods
    # (`message.includes(...)`) are not calls that show anything and are
    # kept out by the KIND constraint below.
    - all:
        - any:
            - pattern: $UI.$KIND($MSG, $$$REST)
            - pattern: $UI.$KIND($MSG)
        - has:
            field: function
            regex: "^(toast|notify|message|notification|notifications|snackbar|Alert)\\."
    # res.send("...")
    - all:
        - pattern: $RES.send($MSG)
        - has:
            field: function
            regex: "^(res|reply|response|ctx)\\b"
    # res.json({ message: "..." }), res.status(n).json({ ..., message: "..." })
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: "^(res|reply|response|ctx)\\b.*\\.(json|send|render)$"
        - has:
            field: arguments
            has:
              kind: object
              has:
                kind: pair
                all:
                  - has: { field: key, regex: "^(message|msg|error|detail|status)$" }
                  - has: { field: value, pattern: $MSG }
    # jsonResponse({ error: "..." }, 400): a local helper that builds the
    # response, common in Workers-style code where there is no `res`.
    - all:
        - kind: call_expression
        - has:
            field: function
            regex: "^(jsonResponse|errorResponse|jsonError|sendJson|respondJson|json)$"
        - has:
            field: arguments
            has:
              kind: object
              has:
                kind: pair
                all:
                  - has: { field: key, regex: "^(message|msg|error|detail|status)$" }
                  - has: { field: value, pattern: $MSG }
constraints:
  KIND:
    not:
      regex: "^(includes|startsWith|endsWith|indexOf|match|test|replace|replaceAll|tr\
        im|split|slice|substring|toLowerCase|toUpperCase|localeCompare|concat|p\
        adStart|padEnd)$"
ask: >-
  This message ($MSG), shown to the user, tells them something other than what
  the surrounding code actually did.
criteria:
  "true": >-
    The message states an outcome the code in front of it did not establish: it
    reports an operation as done or successful when the code only enqueued,
    scheduled or started it; it reports it as done when the code did not wait
    for it, so the message is shown before the outcome is known; it reports
    success when the code holds a result that can express failure and did not
    look at it; it claims a specific, stronger fact than what was done, such as
    "permanently deleted" when the code only marks a record; it reports an
    action the code never performed at all; or it names one specific cause when
    the branch it sits on is visibly reached by other causes too: a catch that
    names a network failure when the try block also throws a validation error,
    or a condition joined with || that names only one of its alternatives, such
    as calling a link expired when the same branch is taken for a token that is
    missing or already used.
  "false": >-
    The message matches what the code did and knows. An awaited call that either
    completed or threw counts as done, whether or not its return value is
    inspected. Saying received, started, queued or scheduled after enqueuing is
    honest. Naming a soft action by its usual word, such as archived, closed or
    cancelled for a record that was flagged rather than destroyed, is honest
    unless the message adds a claim the code does not make. A generic failure
    message in a generic catch is honest, and so is a message that covers every
    cause of its branch, such as "no longer valid" for a token that is missing,
    used or expired. A progress message such as "Saving" before the operation is
    honest. A message that is vague, terse or could be more specific is not a
    violation, and a message that restates the intent of the call it follows,
    such as "invitation sent" after a successful call to an invitations
    endpoint, is honest.
note: >-
  Judge only what the enclosing function shows. A claim about what a server, a
  job or another system will do later, such as data being removed after a
  retention period, is not checkable here and is not a violation. A call whose
  argument is not a message for a human, such as a body, a buffer, a
  health-check string or an empty string, is not a violation.
